services:
  mongodb:
    image: mongo:7
    container_name: turismo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: turismo
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: turismo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: turismo
      ALLOWED_ORIGINS: http://localhost:3000
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-recordatorio_carga}
      WHATSAPP_ALLOWED_TEMPLATE_NAMES: ${WHATSAPP_ALLOWED_TEMPLATE_NAMES:-recordatorio_carga,carga_incompleta,aviso_administrativo}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es_AR}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v20.0}
      WHATSAPP_UTILITY_MESSAGE_COST_ARS: ${WHATSAPP_UTILITY_MESSAGE_COST_ARS:-37.68}
      META_APP_SECRET: ${META_APP_SECRET:-}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: turismo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  mongodb_data:
